server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30d
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        max-age: 30d
        http-only: true
        secure: true
        same-site: lax
        path: /

spring:
  application:
    name: watchtower
  cloud:
    oci:
      config:
        type: INSTANCE_PRINCIPAL
      region:
        static: ap-osaka-1
      vault:
        compartment: ocid1.tenancy.oc1..aaaaaaaajrqij5qzv6e6fnfaq2pk2pjexmmgkbgabdwkyglw2kz2a3egbkna
  lifecycle:
    timeout-per-shutdown-phase: 60s

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
  datasource:
    platform: postgres
    driverClassName: org.postgresql.Driver
