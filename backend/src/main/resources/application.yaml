server:
  shutdown: graceful

spring:
  application:
    name: watchtower
  config:
    import: aws-parameterstore:/watchtower/backend/
  lifecycle:
    timeout-per-shutdown-phase: 60s

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
  datasource:
    platform: postgres
    driverClassName: org.postgresql.Driver
