server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30d
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        max-age: 30d
        http-only: true
        secure: true
        same-site: lax
        path: /

spring:
  application:
    name: watchtower
  config:
    import: aws-parameterstore:/watchtower/backend/
  lifecycle:
    timeout-per-shutdown-phase: 60s

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
  datasource:
    platform: postgres
    driverClassName: org.postgresql.Driver
