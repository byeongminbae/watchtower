name: watchtower-deploy
run-name: Deploy ${{ inputs.service }}${{ inputs.service != 'crawler' && format(' to {0}', inputs.environment) || '' }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: "배포 대상 서비스"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - crawler
        default: backend
      environment:
        description: "배포 환경 (crawler 는 dev, prod 공용이라 선택값 무시)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: deploy-${{ inputs.service }}-${{ inputs.service != 'crawler' && inputs.environment || 'shared' }}

env:
  SERVICE: ${{ inputs.service }}
  DEPLOY_ENV: ${{ inputs.environment }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve deploy target
        env:
          APP_DOKKU_HOST: ${{ vars.DOKKU_HOST }}
          APP_DEPLOY_NSG_ID: ${{ vars.OCI_DEPLOY_NSG_ID }}
          APP_KNOWN_HOSTS: ${{ vars.DOKKU_KNOWN_HOSTS }}
          CRAWLER_DOKKU_HOST: ${{ vars.CRAWLER_DOKKU_HOST }}
          CRAWLER_DEPLOY_NSG_ID: ${{ vars.OCI_CRAWLER_DEPLOY_NSG_ID }}
          CRAWLER_KNOWN_HOSTS: ${{ vars.CRAWLER_DOKKU_KNOWN_HOSTS }}
        run: |
          case "$SERVICE" in
            backend)
              app="back-$DEPLOY_ENV"; tag="$DEPLOY_ENV-$GITHUB_SHA"; target=app
              build_args="--build-arg SPRING_PROFILE=$DEPLOY_ENV" ;;
            frontend)
              app="front-$DEPLOY_ENV"; tag="$DEPLOY_ENV-$GITHUB_SHA"; target=app
              build_args="--build-arg INTERNAL_API_BASE_URL=http://back-$DEPLOY_ENV.web:8080" ;;
            crawler)
              app="crawler"; tag="$GITHUB_SHA"; target=crawler
              build_args="" ;;
          esac

          if [ "$target" = "crawler" ]; then
            host="$CRAWLER_DOKKU_HOST"; nsg_id="$CRAWLER_DEPLOY_NSG_ID"; known_hosts="$CRAWLER_KNOWN_HOSTS"
          else
            host="$APP_DOKKU_HOST"; nsg_id="$APP_DEPLOY_NSG_ID"; known_hosts="$APP_KNOWN_HOSTS"
          fi

          {
            echo "IMAGE_URI=ghcr.io/$GITHUB_REPOSITORY_OWNER/watchtower-$SERVICE:$tag"
            echo "DOKKU_APP=$app"
            echo "DOKKU_HOST=$host"
            echo "DEPLOY_NSG_ID=$nsg_id"
            echo "DOKKU_KNOWN_HOSTS=$known_hosts"
            echo "BUILD_ARGS=$build_args"
          } >> "$GITHUB_ENV"

      - name: Build image
        run: |
          # shellcheck disable=SC2086
          docker build $BUILD_ARGS \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_URI" \
            "./$SERVICE"

      - name: Verify image health
        run: |
          CI_OCI_PRIVATE_KEY="$(openssl genrsa 2048 2>/dev/null)" \
            docker compose --file .github/ci/compose.yml --profile "$SERVICE" up --detach --wait --wait-timeout 300

      - name: Show container logs
        if: failure()
        run: docker compose --file .github/ci/compose.yml --profile "$SERVICE" logs

      - name: Push image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_URI"

      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Allow runner SSH
        id: runner-ssh
        env: &oci-cli-env
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com)
          ssh_rule=$(jq -n \
            --arg source "$runner_ip/32" \
            --arg description "github-actions run $GITHUB_RUN_ID" \
            '[{
              direction: "INGRESS",
              protocol: "6",
              source: $source,
              sourceType: "CIDR_BLOCK",
              tcpOptions: {destinationPortRange: {min: 22, max: 22}},
              description: $description
            }]')

          rule_id=$(oci network nsg rules add \
            --nsg-id "$DEPLOY_NSG_ID" \
            --security-rules "$ssh_rule" \
            --query 'data."security-rules"[0].id' \
            --raw-output)
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Dokku
        env:
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/dokku
          echo "$DOKKU_SSH_PRIVATE_KEY" > ~/.ssh/dokku
          echo "$DOKKU_KNOWN_HOSTS" > ~/.ssh/known_hosts

          dokku() {
            ssh -i ~/.ssh/dokku -o ConnectTimeout=10 "dokku@$DOKKU_HOST" "$@"
          }

          attempts=0
          until dokku version >/dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 12 ]; then
              echo "Dokku 서버에 SSH로 연결할 수 없음" >&2
              exit 1
            fi
            sleep 5
          done

          echo "$GITHUB_TOKEN" | dokku registry:login --global --password-stdin ghcr.io "$GITHUB_ACTOR"
          dokku git:from-image "$DOKKU_APP" "$IMAGE_URI"

          # 크롤러는 사용자가 입력한 URL 을 열기 때문에 호스트 방화벽 없이 실행되면 안 됨
          if [ "$SERVICE" = "crawler" ] && ! dokku run crawler node dist/egress-check.js; then
            dokku ps:stop crawler
            echo "크롤러 호스트 방화벽이 없어 크롤러를 중지함. infra/crawler-firewall.sh 를 적용한 뒤 다시 배포해야 함" >&2
            exit 1
          fi

      - name: Revoke runner SSH
        if: always() && steps.runner-ssh.outputs.rule_id != ''
        env: *oci-cli-env
        run: |
          oci network nsg rules remove \
            --nsg-id "$DEPLOY_NSG_ID" \
            --security-rule-ids '["${{ steps.runner-ssh.outputs.rule_id }}"]'
