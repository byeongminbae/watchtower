name: watchtower-deploy
run-name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: "배포 대상 서비스"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - caddy
        default: backend
      environment:
        description: "배포 환경 (Caddy는 공용 서비스라 선택값 무시)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

env:
  SERVICE: ${{ inputs.service }}
  DEPLOY_ENV: ${{ inputs.environment }}
  ECR_REPOSITORY: watchtower-${{ inputs.service }}-ecr
  ECS_CLUSTER: watchtower-cluster
  ECS_SERVICE: ${{ inputs.service == 'caddy' && 'watchtower-caddy-task-service' || format('watchtower-{0}-{1}-task-service', inputs.service, inputs.environment) }}
  TASK_CONTAINER_NAME: watchtower-${{ inputs.service }}-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build image
        if: env.SERVICE != 'caddy'
        env:
          IMAGE_TAG: ${{ env.SERVICE }}-${{ env.DEPLOY_ENV }}-${{ github.sha }}
        run: |
          local_image="watchtower/${SERVICE}:${IMAGE_TAG}"
          build_args=(--build-arg "SPRING_PROFILE=${DEPLOY_ENV}")

          if [ "$SERVICE" = "frontend" ]; then
            build_args+=(--build-arg "INTERNAL_API_BASE_URL=http://back-${DEPLOY_ENV}:8080")
          fi

          docker build \
            -f "${SERVICE}/Dockerfile" \
            "${build_args[@]}" \
            -t "$local_image" \
            "./${SERVICE}"

          echo "LOCAL_IMAGE=$local_image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Verify image health
        if: env.SERVICE != 'caddy'
        run: |
          app_container="watchtower-ci-${SERVICE}"
          db_container="watchtower-ci-postgres"
          network="watchtower-ci"

          cleanup() {
            docker container rm --force "$app_container" >/dev/null 2>&1 || true
            docker container rm --force "$db_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }

          show_logs() {
            docker logs "$app_container" 2>&1 || true
            if [ "$SERVICE" = "backend" ]; then
              docker logs "$db_container" 2>&1 || true
            fi
          }

          trap cleanup EXIT
          cleanup

          if [ "$SERVICE" = "backend" ]; then
            docker network create "$network" >/dev/null
            docker run --detach \
              --name "$db_container" \
              --network "$network" \
              --env POSTGRES_DB=watchtower \
              --env POSTGRES_USER=watchtower \
              --env POSTGRES_PASSWORD=watchtower \
              postgres:17-alpine >/dev/null

            for _ in $(seq 1 30); do
              if docker exec "$db_container" sh -c \
                '[ "$(cat /proc/1/comm)" = "postgres" ] && pg_isready --username watchtower --dbname watchtower' \
                >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            if ! docker exec "$db_container" sh -c \
              '[ "$(cat /proc/1/comm)" = "postgres" ] && pg_isready --username watchtower --dbname watchtower' \
              >/dev/null 2>&1; then
              show_logs
              exit 1
            fi

            docker run --detach \
              --name "$app_container" \
              --network "$network" \
              --env AWS_ACCESS_KEY_ID \
              --env AWS_SECRET_ACCESS_KEY \
              --env AWS_SESSION_TOKEN \
              --env AWS_REGION \
              --env SPRING_DATASOURCE_URL=jdbc:postgresql://watchtower-ci-postgres:5432/watchtower \
              --env SPRING_DATASOURCE_USERNAME=watchtower \
              --env SPRING_DATASOURCE_PASSWORD=watchtower \
              "$LOCAL_IMAGE" >/dev/null
          else
            docker run --detach \
              --name "$app_container" \
              "$LOCAL_IMAGE" >/dev/null
          fi

          for _ in $(seq 1 30); do
            if ! health_status=$(docker inspect --format '{{.State.Health.Status}}' "$app_container"); then
              show_logs
              exit 1
            fi
            if [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$health_status" = "unhealthy" ]; then
              show_logs
              exit 1
            fi
            sleep 5
          done

          show_logs
          exit 1

      - name: Verify ECS capacity
        run: |
          connected_instances=$(aws ecs list-container-instances \
            --cluster "$ECS_CLUSTER" \
            --filter "agentConnected == true" \
            --query 'length(containerInstanceArns)' \
            --output text)

          if [ "$connected_instances" -eq 0 ]; then
            echo "No connected ECS container instance is available in $ECS_CLUSTER" >&2
            exit 1
          fi

      - name: Login to ECR
        if: env.SERVICE != 'caddy'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: env.SERVICE != 'caddy'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Render task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-definition.${{ env.SERVICE }}.json
          container-name: ${{ env.TASK_CONTAINER_NAME }}
          image: ${{ env.SERVICE == 'caddy' && 'caddy:2-alpine' || env.IMAGE_URI }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Start deployed service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 1 \
            --output json >/dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
