name: watchtower-deploy
run-name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: "배포 대상 서비스"
        required: true
        type: choice
        options:
          - backend
          - frontend
        default: backend
      environment:
        description: "배포 환경"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: deploy-${{ inputs.service }}-${{ inputs.environment }}

env:
  SERVICE: ${{ inputs.service }}
  DEPLOY_ENV: ${{ inputs.environment }}
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/watchtower-${{ inputs.service }}
  DOKKU_APP: ${{ inputs.service == 'backend' && 'back' || 'front' }}-${{ inputs.environment }}
  DOKKU_HOST: ${{ vars.DOKKU_HOST }}
  DEPLOY_NSG_ID: ${{ vars.OCI_DEPLOY_NSG_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        env:
          IMAGE_TAG: ${{ env.DEPLOY_ENV }}-${{ github.sha }}
        run: |
          image_uri="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          build_args=(--build-arg "SPRING_PROFILE=${DEPLOY_ENV}")

          if [ "$SERVICE" = "frontend" ]; then
            build_args+=(--build-arg "INTERNAL_API_BASE_URL=http://back-${DEPLOY_ENV}.web:8080")
          fi

          docker build \
            -f "${SERVICE}/Dockerfile" \
            "${build_args[@]}" \
            -t "$image_uri" \
            "./${SERVICE}"

          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Verify image health
        run: |
          app_container="watchtower-ci-${SERVICE}"
          db_container="watchtower-ci-postgres"
          network="watchtower-ci"

          cleanup() {
            docker container rm --force "$app_container" >/dev/null 2>&1 || true
            docker container rm --force "$db_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }

          show_logs() {
            docker logs "$app_container" 2>&1 || true
            if [ "$SERVICE" = "backend" ]; then
              docker logs "$db_container" 2>&1 || true
            fi
          }

          trap cleanup EXIT
          cleanup

          if [ "$SERVICE" = "backend" ]; then
            docker network create "$network" >/dev/null
            docker run --detach \
              --name "$db_container" \
              --network "$network" \
              --env POSTGRES_DB=watchtower \
              --env POSTGRES_USER=watchtower \
              --env POSTGRES_PASSWORD=watchtower \
              postgres:18-alpine >/dev/null

            for _ in $(seq 1 30); do
              if docker exec "$db_container" sh -c \
                '[ "$(cat /proc/1/comm)" = "postgres" ] && pg_isready --username watchtower --dbname watchtower' \
                >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            if ! docker exec "$db_container" sh -c \
              '[ "$(cat /proc/1/comm)" = "postgres" ] && pg_isready --username watchtower --dbname watchtower' \
              >/dev/null 2>&1; then
              show_logs
              exit 1
            fi

            docker run --detach \
              --name "$app_container" \
              --network "$network" \
              --env SPRING_CLOUD_OCI_VAULT_ENABLED=false \
              --env SPRING_AUTOCONFIGURE_EXCLUDE=com.oracle.cloud.spring.autoconfigure.core.CredentialsProviderAutoConfiguration \
              --env SPRING_DATASOURCE_URL=jdbc:postgresql://watchtower-ci-postgres:5432/watchtower \
              --env SPRING_DATASOURCE_USERNAME=watchtower \
              --env SPRING_DATASOURCE_PASSWORD=watchtower \
              --env WATCHTOWER_AUTH_NAVER_CLIENT_ID=ci \
              --env WATCHTOWER_AUTH_NAVER_CLIENT_SECRET=ci \
              --env WATCHTOWER_AUTH_NAVER_CALLBACK_URL=http://127.0.0.1:3000/login/callback \
              "$IMAGE_URI" >/dev/null
          else
            docker run --detach \
              --name "$app_container" \
              "$IMAGE_URI" >/dev/null
          fi

          for _ in $(seq 1 30); do
            if ! health_status=$(docker inspect --format '{{.State.Health.Status}}' "$app_container"); then
              show_logs
              exit 1
            fi
            if [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$health_status" = "unhealthy" ]; then
              show_logs
              exit 1
            fi
            sleep 5
          done

          show_logs
          exit 1

      - name: Push image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_URI"

      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Allow runner SSH
        id: runner-ssh
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com)
          rule_id=$(oci network nsg rules add \
            --nsg-id "$DEPLOY_NSG_ID" \
            --security-rules "[{\"direction\":\"INGRESS\",\"protocol\":\"6\",\"source\":\"${runner_ip}/32\",\"sourceType\":\"CIDR_BLOCK\",\"tcpOptions\":{\"destinationPortRange\":{\"min\":22,\"max\":22}},\"description\":\"github-actions run ${{ github.run_id }}\"}]" \
            --query 'data."security-rules"[0].id' \
            --raw-output)
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Dokku
        env:
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          DOKKU_KNOWN_HOSTS: ${{ vars.DOKKU_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DOKKU_SSH_PRIVATE_KEY" > ~/.ssh/dokku
          chmod 600 ~/.ssh/dokku
          echo "$DOKKU_KNOWN_HOSTS" > ~/.ssh/known_hosts

          dokku() {
            ssh -i ~/.ssh/dokku -o ConnectTimeout=10 "dokku@${DOKKU_HOST}" "$@"
          }

          for _ in $(seq 1 12); do
            if dokku version >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          echo "$GITHUB_TOKEN" | dokku registry:login --password-stdin ghcr.io "${{ github.actor }}"
          dokku git:from-image "$DOKKU_APP" "$IMAGE_URI"

      - name: Revoke runner SSH
        if: always() && steps.runner-ssh.outputs.rule_id != ''
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          oci network nsg rules remove \
            --nsg-id "$DEPLOY_NSG_ID" \
            --security-rule-ids '["${{ steps.runner-ssh.outputs.rule_id }}"]'
