name: watchtower-deploy
run-name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: "배포 대상 서비스"
        required: true
        type: choice
        options:
          - backend
          - frontend
        default: backend
      environment:
        description: "배포 환경"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: deploy-${{ inputs.service }}-${{ inputs.environment }}

env:
  SERVICE: ${{ inputs.service }}
  DEPLOY_ENV: ${{ inputs.environment }}
  IMAGE_URI: ghcr.io/${{ github.repository_owner }}/watchtower-${{ inputs.service }}:${{ inputs.environment }}-${{ github.sha }}
  DOKKU_APP: ${{ inputs.service == 'backend' && 'back' || 'front' }}-${{ inputs.environment }}
  DOKKU_HOST: ${{ vars.DOKKU_HOST }}
  DEPLOY_NSG_ID: ${{ vars.OCI_DEPLOY_NSG_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          build_args=(--build-arg "SPRING_PROFILE=$DEPLOY_ENV")
          if [ "$SERVICE" = "frontend" ]; then
            build_args+=(--build-arg "INTERNAL_API_BASE_URL=http://back-$DEPLOY_ENV.web:8080")
          fi

          docker build "${build_args[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_URI" \
            "./$SERVICE"

      - name: Verify image health
        run: docker compose --file .github/ci/compose.yml --profile "$SERVICE" up --detach --wait --wait-timeout 300

      - name: Show container logs
        if: failure()
        run: docker compose --file .github/ci/compose.yml --profile "$SERVICE" logs

      - name: Push image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_URI"

      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Allow runner SSH
        id: runner-ssh
        env: &oci-cli-env
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          runner_ip=$(curl -fsS https://checkip.amazonaws.com)
          ssh_rule=$(jq -n \
            --arg source "$runner_ip/32" \
            --arg description "github-actions run $GITHUB_RUN_ID" \
            '[{
              direction: "INGRESS",
              protocol: "6",
              source: $source,
              sourceType: "CIDR_BLOCK",
              tcpOptions: {destinationPortRange: {min: 22, max: 22}},
              description: $description
            }]')

          rule_id=$(oci network nsg rules add \
            --nsg-id "$DEPLOY_NSG_ID" \
            --security-rules "$ssh_rule" \
            --query 'data."security-rules"[0].id' \
            --raw-output)
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Dokku
        env:
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          DOKKU_KNOWN_HOSTS: ${{ vars.DOKKU_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/dokku
          echo "$DOKKU_SSH_PRIVATE_KEY" > ~/.ssh/dokku
          echo "$DOKKU_KNOWN_HOSTS" > ~/.ssh/known_hosts

          dokku() {
            ssh -i ~/.ssh/dokku -o ConnectTimeout=10 "dokku@$DOKKU_HOST" "$@"
          }

          attempts=0
          until dokku version >/dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 12 ]; then
              echo "Dokku 서버에 SSH로 연결할 수 없음" >&2
              exit 1
            fi
            sleep 5
          done

          echo "$GITHUB_TOKEN" | dokku registry:login --password-stdin ghcr.io "$GITHUB_ACTOR"
          dokku git:from-image "$DOKKU_APP" "$IMAGE_URI"

      - name: Revoke runner SSH
        if: always() && steps.runner-ssh.outputs.rule_id != ''
        env: *oci-cli-env
        run: |
          oci network nsg rules remove \
            --nsg-id "$DEPLOY_NSG_ID" \
            --security-rule-ids '["${{ steps.runner-ssh.outputs.rule_id }}"]'
