name: watchtower-ci

services:
  postgres:
    profiles: [backend]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: watchtower
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "watchtower", "--dbname", "watchtower"]
      interval: 1s
      retries: 30

  backend:
    profiles: [backend]
    image: ${IMAGE_URI}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_CLOUD_OCI_VAULT_ENABLED: "false"
      # 러너에는 OCI 자격 증명이 없어서, 큐 클라이언트를 만들 수만 있도록 OCI 에 등록하지 않은 일회용 키로 가짜 자격 증명을 줌
      SPRING_CLOUD_OCI_CONFIG_TYPE: SIMPLE
      SPRING_CLOUD_OCI_CONFIG_USERID: ci
      SPRING_CLOUD_OCI_CONFIG_TENANTID: ci
      SPRING_CLOUD_OCI_CONFIG_FINGERPRINT: ci
      SPRING_CLOUD_OCI_CONFIG_REGION: ap-osaka-1
      SPRING_CLOUD_OCI_CONFIG_PRIVATEKEY: /run/ci/oci-key.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/watchtower
      SPRING_DATASOURCE_USERNAME: watchtower
      SPRING_DATASOURCE_PASSWORD: watchtower
      WATCHTOWER_AUTH_NAVER_CLIENT_ID: ci
      WATCHTOWER_AUTH_NAVER_CLIENT_SECRET: ci
      WATCHTOWER_AUTH_NAVER_CALLBACK_URL: http://127.0.0.1:3000/login/callback
    volumes:
      - ${CI_OCI_KEY_FILE:-/dev/null}:/run/ci/oci-key.pem:ro

  frontend:
    profiles: [frontend]
    image: ${IMAGE_URI}

  crawler:
    profiles: [crawler]
    image: ${IMAGE_URI}
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "--eval", "await import('/app/dist/app.module.js')"]
      interval: 10s
      retries: 1
